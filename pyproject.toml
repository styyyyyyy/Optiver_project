[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optiver-volatility-research"
version = "0.2.0"
description = "Leakage-aware grouped-CV research for realized-volatility prediction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "lightgbm>=4.0",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "scikit-learn>=1.6",
]

[project.optional-dependencies]
mlp = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]
dev = ["ruff>=0.6"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
